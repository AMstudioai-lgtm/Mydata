name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compiler sans publier de release"
        type: boolean
        default: false

# Le token par défaut doit pouvoir pousser des tags et publier des releases.
permissions:
  contents: write

# Sérialise les builds : deux pushes rapprochés ne créent jamais deux fois la même version.
concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build et publication de la release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique + tags, nécessaires au bump de version

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet "tools" a été retiré du dépôt Google : sa demande fait échouer l'action.
          packages: ""

      # La plateforme 36.1 (compileSdk minorApiLevel) est absente du runner :
      # AGP la télécharge de lui-même, on anticipe ici pour gagner un cycle.
      - name: Installer les composants SDK
        run: |
          set -euo pipefail
          SDKMANAGER="sdkmanager"
          command -v sdkmanager >/dev/null 2>&1 || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for p in "platform-tools" "platforms;android-36" "platforms;android-36.1"; do
            "$SDKMANAGER" "$p" || echo "::notice::$p indisponible, AGP complètera au build"
          done

      # Le dépôt n'a pas de gradlew versionné : on installe la version attendue par le projet.
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Déterminer la version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP "(?<=versionName = \")[^\"]+" app/build.gradle.kts)
          CURRENT_CODE=$(grep -oP "(?<=versionCode = )[0-9]+" app/build.gradle.kts)
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            # Version déjà publiée : incrémente le patch et pousse le bump.
            MAJOR=${CURRENT%%.*}
            REST=${CURRENT#*.}
            MINOR=${REST%%.*}
            PATCH=${REST#*.}
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            CODE=$((CURRENT_CODE + 1))

            sed -i -E -e "s/versionCode = [0-9]+/versionCode = $CODE/" -e "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

            # En dry run on ne touche pas au dépôt : le bump est seulement affiché.
            if [ "$DRY_RUN" != "true" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "chore: bump version $VERSION [skip ci]"
              git push origin HEAD:main
            fi
          else
            VERSION="$CURRENT"
            CODE="$CURRENT_CODE"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (code $CODE)"

      - name: Préparer la signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            # Option recommandée : keystore stable fourni dans les secrets du dépôt.
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
            echo "SIGNING=stable" >> "$GITHUB_ENV"
          else
            # Repli : clé jetable générée à chaque run. APK installable mais signature
            # changeante : les utilisateurs devront désinstaller pour mettre à jour.
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ci.jks" -alias upload -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 9125 -storepass ci-ci-ci -keypass ci-ci-ci -dname "CN=Mydata CI, OU=Build, O=Mydata, C=FR"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/ci.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=ci-ci-ci" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=ci-ci-ci" >> "$GITHUB_ENV"
            echo "SIGNING=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "Mydata-$V.apk"
          ls -lh "Mydata-$V.apk"

      - name: Notes de release
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --match "v*" HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:"%s" "$PREV"..HEAD)
          else
            LOG=""
          fi

          # Classement des commits en deux rubriques simples.
          # feat: (ou nouveauté détectée) -> Nouveautés, fix: (ou mot-clé de
          # correction) -> Bugs corrigés. Commits internes ignorés (merge,
          # chore, docs, ci, build, test, bump [skip ci]).
          FEATS=""
          FIXES=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              "Merge "*|*"[skip ci]"*) continue ;;
            esac
            clean=$(echo "$line" | sed -E 's/^(feat|fix)(\([^)]*\))?(!)?:[[:space:]]*//I')
            case "$line" in
              fix:*|FIX:*)
                FIXES="${FIXES}- ${clean}\n" ;;
              feat:*|FEAT:*)
                FEATS="${FEATS}- ${clean}\n" ;;
              *)
                if echo "$line" | grep -qiE "fix|bug|corrige|répare|repare|plantage|panne|erreur"; then
                  FIXES="${FIXES}- ${clean}\n"
                elif echo "$line" | grep -qiE "^(docs|ci|build|test|refactor|style|perf)[:( ]"; then
                  continue
                else
                  FEATS="${FEATS}- ${clean}\n"
                fi
                ;;
            esac
          done <<< "$LOG"

          {
            if [ -n "$FEATS" ]; then
              echo "## Nouveautés"
              echo ""
              printf "%b" "$FEATS" | awk '!seen[$0]++'
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "## Bugs corrigés"
              echo ""
              printf "%b" "$FIXES" | awk '!seen[$0]++'
              echo ""
            fi
          } > changelog.md
          if [ "$SIGNING" = "ephemeral" ]; then
            echo "" >> changelog.md
            echo "> [!WARNING]" >> changelog.md
            echo "> Build signé avec une clé jetable générée par le CI. La signature change" >> changelog.md
            echo "> à chaque release : désinstaller l'ancienne version avant d'installer." >> changelog.md
          fi

      - name: Publier la release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "Mydata-$VERSION.apk" --title "Mydata v$VERSION" --notes-file changelog.md --target "$COMMIT"
