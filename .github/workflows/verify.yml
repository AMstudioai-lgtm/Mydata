name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Composants SDK
        run: |
          set -euo pipefail
          SDKMANAGER="sdkmanager"
          command -v sdkmanager >/dev/null 2>&1 || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for p in "platform-tools" "platforms;android-36" "platforms;android-36.1"; do
            "$SDKMANAGER" "$p" || echo "::notice::$p indisponible, AGP complètera au build"
          done

      # Le dépôt n'a pas de gradlew versionné : on installe directement la version attendue.
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # debug.keystore est gitignored (AI Studio le génère localement) : on en crée un pour la CI.
      # Il n'est utilisé que pour signer les APK de debug, jamais pour la release.
      - name: Keystore de debug
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 9125 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilation
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Tests unitaires
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
